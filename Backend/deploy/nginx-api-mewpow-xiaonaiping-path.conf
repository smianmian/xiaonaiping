# Transitional route until a dedicated XiaoNaiPing API domain resolves to the ECS.
# Public base URL: https://api.mewpow.com/xiaonaiping
# Backend service: xiaonaiping-api.service on 127.0.0.1:8787

location = /xiaonaiping {
    return 308 /xiaonaiping/healthz;
}

location = /xiaonaiping/internal {
    return 404;
}

location ^~ /xiaonaiping/internal/ {
    return 404;
}

location ^~ /xiaonaiping/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 25m;
    add_header X-XiaoNaiPing-Route isolated-service always;
}
