    - generic [ref=e50]:
      - heading "应用介绍" [level=2] [ref=e51]
      - paragraph [ref=e53]: 小奶瓶面向成年人父母或照护者使用，不面向儿童直接使用。产品目标是降低半夜、单手、赶时间记录宝宝信息的负担，让家庭成员能用统一时间线查看宝宝成长。App 内的灵动岛、锁屏 Live Activity 和小组件只做状态展示，不生成健康建议、压力提醒、喂养建议或医疗判断。
