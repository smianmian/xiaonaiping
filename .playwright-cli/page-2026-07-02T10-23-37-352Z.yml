      - paragraph [ref=e69]: 小奶瓶移动应用正在微信开放平台和 App Store Connect 审核准备中。正式下载入口、App Store 链接和应用市场信息上线后，会在本官网首页同步更新。
    - generic [ref=e70]:
      - heading "小奶瓶支持" [level=2] [ref=e71]
      - generic [ref=e72]:
        - article [ref=e73]:
          - heading "如何备份？" [level=3] [ref=e74]
          - paragraph [ref=e75]: 在 App 的“资料 -> 账号与备份”中通过恢复密钥、手机号或微信登录后备份。请妥善保存恢复密钥。
        - article [ref=e76]:
          - heading "如何删除云端数据？" [level=3] [ref=e77]
          - paragraph [ref=e78]: 在“资料 -> 账号与备份 -> 删除云端账号与备份”中二次确认后删除云端账号、备份和照片对象。
        - article [ref=e79]:
          - heading "提醒如何顺延？" [level=3] [ref=e80]
          - paragraph [ref=e81]: 保存新喂养时，如果已设置固定喝奶间隔，可以手动顺延下一次喝奶提醒：可用 5 分钟一档选择不顺延或顺延 +5、+10、+15、+20、+25、+30 分钟。保存后，下一次提醒按本顿结束时间 + 固定间隔 + 顺延分钟重排；本顿无喂养时长时按本顿发生时间计算。顺延只改变下一次提醒时间，不新增持久化字段。
    - generic [ref=e82]:
      - heading "服务边界" [level=2] [ref=e83]
      - list [ref=e85]:
