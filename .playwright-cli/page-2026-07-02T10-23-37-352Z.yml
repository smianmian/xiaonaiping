        - img "小奶瓶应用运行流程图" [ref=e58]
        - paragraph [ref=e59]: 应用运行流程图：用户创建宝宝档案后，按需记录喂养、睡眠、排便、成长和照片；登录后可备份，换机时可恢复，也可删除云端账号与备份。
        - generic "应用运行流程" [ref=e60]:
          - generic [ref=e61]: 创建宝宝档案
          - generic [ref=e62]: 记录喂养 / 睡眠 / 排便 / 成长
          - generic [ref=e63]: 查看时间线和提醒
          - generic [ref=e64]: 账号登录并私密备份
          - generic [ref=e65]: 换机恢复或删除云端账号与备份
