  - generic [ref=e139]:
    - generic [ref=e140]:
      - heading "情绪香氛模块" [level=2] [ref=e141]
      - paragraph [ref=e142]: 围绕专注、放松、入睡与陪伴场景设计的香氛模块。
      - paragraph [ref=e143]: MEWPOW 情绪香氛模块，是情绪空间系统的气味输出层。每一款香气围绕具体空间场景设计：专注、放松、入睡、陪伴。香氛不单独承担“改变情绪”的任务，而是与 App 记录、声音、光影和硬件联动，成为一种低打扰、可记忆、可持续使用的空间提示。
    - generic [ref=e144]:
      - heading "核心理念" [level=3] [ref=e145]
      - paragraph [ref=e146]: MEWPOW 的核心理念是“感知情绪，重塑空间”。我们把呼吸、心率、行为节奏等状态信号，转化为用户可以感知的空间变化：香气浓淡、光影节奏、声音内容和练习提示。空间不再只是背景，而成为回应状态的界面。
    - generic [ref=e147]:
      - generic [ref=e148]:
        - heading "体验边界" [level=4] [ref=e149]
        - paragraph [ref=e150]: 嗅觉与记忆、情绪体验关系密切。MEWPOW 将香氛作为多感官空间调节的一部分，与声音、光影和 App 练习共同构成完整体验。相关内容用于日常状态记录、放松练习和空间氛围调节，不用于疾病诊断、治疗或替代专业心理咨询。
      - generic [ref=e151]:
        - heading "多感官协同" [level=4] [ref=e152]
        - paragraph [ref=e153]: 单一香气只能改变空气，多感官系统才能改变空间体验。MEWPOW 将嗅觉、听觉、视觉和正念练习组合在一起，让用户在专注、放松、入睡和陪伴等场景中，更容易建立稳定的环境节奏。
